{{define "layout"}}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightPanel - {{template "page-title" .}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Sidebar -->
    <aside class="w-64 fixed inset-y-0 left-0 z-50 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800/50 flex flex-col transition-all duration-300">
        <!-- Logo -->
        <div class="h-20 flex flex-col justify-center px-6 border-b border-slate-800/50">
            <h1 class="text-2xl font-bold tracking-tight">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-violet-400">⚡ LightPanel</span>
            </h1>
            <p class="text-xs text-slate-400 font-medium tracking-wide uppercase mt-1">Hosting Control Panel</p>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto custom-scrollbar">
            <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 {{if eq .ActivePage "dashboard"}}bg-indigo-500/10 text-indigo-400 border-l-2 border-indigo-500{{else}}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{{end}}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="font-medium text-sm">Dashboard</span>
            </a>

            <a href="/sites" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 {{if eq .ActivePage "sites"}}bg-indigo-500/10 text-indigo-400 border-l-2 border-indigo-500{{else}}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{{end}}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                </svg>
                <span class="font-medium text-sm">Sites</span>
            </a>

            <a href="/databases" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 {{if eq .ActivePage "databases"}}bg-indigo-500/10 text-indigo-400 border-l-2 border-indigo-500{{else}}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{{end}}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                </svg>
                <span class="font-medium text-sm">Databases</span>
            </a>

            <a href="/ssl" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 {{if eq .ActivePage "ssl"}}bg-indigo-500/10 text-indigo-400 border-l-2 border-indigo-500{{else}}text-slate-400 hover:text-slate-200 hover:bg-slate-800/50{{end}}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                <span class="font-medium text-sm">SSL Certificates</span>
            </a>
        </nav>

        <!-- Bottom Status -->
        <div class="p-4 border-t border-slate-800/50 space-y-3">
            <div class="flex items-center justify-between px-2">
                <span class="text-xs text-slate-400">Mode</span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 shadow-[0_0_10px_rgba(99,102,241,0.2)]">
                    {{if .Config}}{{.Config.Mode}}{{else}}Standard{{end}}
                </span>
            </div>
            <div class="flex items-center justify-between px-2">
                <span class="text-xs text-slate-400">Version</span>
                <span class="text-xs text-slate-500 font-mono">v1.0.0</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 flex-1 min-h-screen relative overflow-hidden">
        <!-- Decorative background elements -->
        <div class="absolute top-0 right-0 -z-10 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl opacity-50 mix-blend-screen pointer-events-none transform translate-x-1/3 -translate-y-1/2"></div>
        <div class="absolute bottom-0 left-0 -z-10 w-96 h-96 bg-violet-500/10 rounded-full blur-3xl opacity-50 mix-blend-screen pointer-events-none transform -translate-x-1/3 translate-y-1/2"></div>

        <div class="p-8 max-w-7xl mx-auto">
            {{template "content" .}}
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
{{end}}
