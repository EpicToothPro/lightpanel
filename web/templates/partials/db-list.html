{{define "db-list"}}
<!-- Alerts -->
{{if .Success}}
<div class="mb-6 p-4 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-start gap-3 alert-dismiss">
    <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span class="text-sm font-medium">{{.Success}}</span>
</div>
{{end}}

{{if .Error}}
<div class="mb-6 p-4 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 flex items-start gap-3 alert-dismiss">
    <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span class="text-sm font-medium">{{.Error}}</span>
</div>
{{end}}

<!-- Table -->
{{if .Databases}}
<div class="overflow-x-auto rounded-lg border border-slate-700/50">
    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="bg-slate-800/80 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-700/50">
                <th class="px-6 py-4 font-medium">Database Name</th>
                <th class="px-6 py-4 font-medium">Assigned User</th>
                <th class="px-6 py-4 font-medium text-right">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-700/50 text-sm">
            {{range .Databases}}
            <tr class="hover:bg-slate-800/30 transition-colors duration-200">
                <td class="px-6 py-4 font-medium text-slate-200 flex items-center gap-3">
                    <svg class="w-4 h-4 text-emerald-500/70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                    </svg>
                    {{.Name}}
                </td>
                <td class="px-6 py-4 text-slate-400">
                    <span class="font-mono text-xs bg-slate-900/50 px-2 py-1 rounded border border-slate-700/50">{{.User}}</span>
                </td>
                <td class="px-6 py-4 text-right">
                    <button hx-delete="/api/databases?name={{.Name}}&user={{.User}}" hx-target="#db-list" hx-swap="innerHTML" hx-confirm="Are you sure you want to delete database {{.Name}}? All data will be lost!" class="text-slate-400 hover:text-red-400 transition-colors p-1 rounded-md hover:bg-red-400/10">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{else}}
<div class="text-center py-12 px-4 rounded-xl border border-dashed border-slate-700 bg-slate-800/20">
    <div class="bg-slate-800 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-700">
        <svg class="w-6 h-6 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
        </svg>
    </div>
    <h4 class="text-slate-300 font-medium mb-1">No databases found</h4>
    <p class="text-slate-500 text-sm">Create a database to get started.</p>
</div>
{{end}}
{{end}}
