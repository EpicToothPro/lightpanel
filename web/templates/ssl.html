{{define "page-title"}}SSL Certificates{{end}}
{{define "content"}}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-100 tracking-tight">SSL Certificates</h1>
    <p class="text-slate-400 mt-2">Manage Let's Encrypt certificates for your domains.</p>
</div>

<div class="grid grid-cols-1 xl:grid-cols-3 gap-8 items-start">
    <!-- Form Area -->
    <div class="xl:col-span-1">
        <div class="bg-slate-800/50 backdrop-blur-sm border border-slate-700/50 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <!-- Decorative gradient -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl pointer-events-none -mr-16 -mt-16"></div>
            
            <h3 class="text-xl font-semibold text-slate-100 mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Issue Certificate
            </h3>

            <form hx-post="/api/ssl" hx-target="#ssl-list" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.reset()" class="space-y-5 relative z-10">
                
                <div>
                    <label for="domain" class="block text-sm font-medium text-slate-300 mb-1.5">Domain Name</label>
                    <input type="text" id="domain" name="domain" placeholder="example.com" required
                        class="w-full bg-slate-900/80 border border-slate-700 text-slate-100 rounded-lg px-4 py-2.5 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all placeholder:text-slate-600">
                    <p class="mt-2 text-xs text-slate-400 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Using email: <span class="font-medium text-slate-300">{{if .Config}}{{.Config.CertEmail}}{{else}}admin@localhost{{end}}</span>
                    </p>
                </div>

                <button type="submit" class="w-full mt-4 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-medium py-2.5 px-4 rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.3)] hover:shadow-[0_0_20px_rgba(245,158,11,0.5)] transition-all duration-300 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                    Request Certificate
                </button>
            </form>
        </div>
    </div>

    <!-- List Area -->
    <div class="xl:col-span-2">
        <div class="bg-slate-800/50 backdrop-blur-sm border border-slate-700/50 rounded-2xl p-6 shadow-xl">
            <h3 class="text-xl font-semibold text-slate-100 mb-6">Managed Certificates</h3>
            <div id="ssl-list">
                {{template "ssl-list" .}}
            </div>
        </div>
    </div>
</div>
{{end}}
